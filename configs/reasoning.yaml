ollama:
  base_url: "http://localhost:11434"
  generation_model: "llama3.1"
  embedding_model: "nomic-embed-text"
  request_timeout_s: 30

rag:
  regulations_dir: "data/regulations"
  chunk_size_chars: 800
  chunk_overlap_chars: 120
  top_k: 4
  vector_store_dir: "chroma_db"
  collection_name: "traffic_regulations"

prompt:
  # The system prompt constrains the LLM to answer ONLY from retrieved
  # context + current zone — no open-domain generation (per project spec).
  system_prompt: |
    You are a traffic legal assistant. Answer only based on the provided
    regulatory text and the current zone context. If the text does not
    contain sufficient information, state clearly that no suitable regulation
    was found instead of speculating. Keep answers concise and suitable for
    text-to-speech conversion.
