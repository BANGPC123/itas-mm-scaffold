# Imported 59-class checkpoint is a secondary *research overlay*, not an
# automatic replacement of the verified production detector or legal classifier.
auxiliary_sign_review:
  enabled: true
  weights_path: data/raw/user_archives_20261014/yolo11_optimized/weights/best.pt
  labels_path: data/reference/yolo11_optimized_classes_20261014.json
  image_size: 416
  confidence_threshold: 0.65
  overlap_iou: 0.35
  max_candidates: 12

sign_detector:
  image_size: 640
  video_image_size: 960
  video_multiscale: true
  secondary_image_size: 640
  # Rollback: models/sign_detector/retrained_20261009.pt (previous default).
  weights_path: models/sign_detector/finetuned_20261026.pt
  confidence_threshold: 0.35
  iou_threshold: 0.45
  device: "auto"
  # M1.5(d) FP16 detector on CUDA. false = unchanged. Enable only after gate M1.5(d) passes.
  half: false
  # Retained for the legacy grouping entry point; runtime uses applicability rules.
  compound_group_distance_px: 40

sahi:
  enabled: false
  slice_height: 512
  slice_width: 512
  overlap_height_ratio: 0.2
  overlap_width_ratio: 0.2
  postprocess_type: "NMS"
  postprocess_match_threshold: 0.5

lane_visual_fallback:
  camera_aware: true
  surface_veto: true
  surface_veto_path: models/lane/candidates/segformer_cityscapes_20261011
  # Optional dashboard-heavy MP4 VISUAL ONLY. Never use BDD mask for scope.
  model: yolopv2
  weights_path: models/lane/candidates/yolopv2_official_20261011/yolopv2.pt
  roi: 0.80
  mask_threshold: 0.56
  min_span_ratio: 0.20

# Offline MP4 lane display. simple = UFLD-v2 polylines with light sanity filter and temporal
# smoothing, no YOLOPv2 / surface veto / candidate overlay. precision = previous pipeline (rollback).
offline_video_lane:
  # M1: lane stage off by default (demo decision 13/11). false = no UFLD/YOLOPv2/SegFormer load or run.
  enabled: false
  display: simple
  display_row_ratio: 0.5
  # Experiment (lane-only, simple display): preprocess the frame sent to UFLD for the displayed
  # curves only. none keeps the previous path. Sign, camera_view and ego inputs stay on the original frame.
  lane_preprocess: none      # none | gamma | clahe
  lane_gamma: 0.8
  lane_clahe_clip: 2.0
  lane_clahe_tile: 8

lane_detector:
  backend: ufld_v2
  filter_geometry: false
  half: true
  weights_path: models/lane/selected_20261009.pth
  device: auto
  # Parameters used only when the classical backend is explicitly selected.
  canny_low_threshold: 50
  canny_high_threshold: 150
  hough_rho: 2
  hough_theta_deg: 1
  hough_threshold: 90
  hough_min_line_length: 40
  hough_max_line_gap: 25
  roi_top_ratio: 0.6   # fraction of image height where the region of interest starts

sign_recognizer:
  # Rollback: models/sign_recognizer/retrained_20261009.pt with reference_gate_20261011_final.npz
  # (confidence_threshold 0.63, reference_gate_margin 0.015). The old gate holds embeddings of the
  # old encoder and cannot be used with the 2026-10-28 model, so no gate is configured.
  weights_path: models/sign_recognizer/retrained_20261028.pt
  confidence_threshold: 0.87   # calibrated on VAL; the checkpoint value takes precedence at load time
  # Video only (stream_id set). Overrides the checkpoint threshold on the video path; still images keep the checkpoint value.
  # Chosen at CP2 (2026-10-30): T2 value from docs/release_gate_v2.json, precision 90.7% on decided video tracks (cp2_grading.csv).
  video_confidence_threshold: 0.6412901874067937
  min_short_side: 32
  video_min_short_side: 12
  # Keep confident detector boxes that the recognizer scores as background
  # (codes outside its class list; I.434a bus stop is a class since 2026-10-28) as unrecognised
  # signs. Chosen on VAL only: 91% of such boxes at >=0.5 / >=16 px are real signs.
  keep_background_detector_confidence: 0.5
  keep_background_min_side: 16

applicability:
  current_vehicle: car
  panel_overlap: 0.5
  panel_gap_ratio: 0.5
  projection_y_ratio: 0.8
  boundary_margin_ratio: 0.1

# Automatic candidates displayed separately from verified legal conditions.
supplementary_ocr:
  # Disabled in the final build (02/11/2026): the parser covers only time windows and vehicle
  # types, results are not shown in the UI, and night panels were unreadable in the demo clips.
  enabled: false

# M2: forward-object warning (COCO YOLO11n + ByteTrack, single camera, no metric distance).
# TTC here is a relative approach indicator (box growth), not a real time-to-collision.
# Default false until the M2 gate passes. Rollback = keep false.
forward_warning:
  enabled: true
  weights_path: models/lane/candidates/coco_yolo11n_20261011.pt
  imgsz: 640
  conf: 0.35
  # M8.2: FP16 COCO inference on CUDA tested at 13.8 s vs 10.8 s FP32 on night 90 s (slower). Kept false.
  half: false
  # M8.3c: COCO runs on every 2nd analysis sample (3 Hz). Persist counts and ttc_k are halved so the
  # hysteresis stays at the same wall-clock time (chu_y 6 samples at 6 Hz = 1.0 s -> 3 at 3 Hz; nguy_co 2 -> 1).
  detect_every: 2
  zone:
    bottom_width_ratio: 0.50
    top_width_ratio: 0.16
    top_y_ratio: 0.55
  chu_y_bottom_ratio: 0.80
  chu_y_persist: 3
  nguy_co_ttc_s: 2.0
  nguy_co_persist: 1
  ttc_k: 2
  # M9: chu_y speech cooldowns (nguy_co is always spoken). Boxes and banner show every alert.
  voice_cooldown_s: 8.0
  voice_class_cooldown_s: 15.0
  ttc_min_scale: 1.03
  cooldown_track_s: 6.0
  cooldown_global_s: 3.0
